{% extends "base.html" %}
{% block content %}
<div class="card">
  <header><h3>数据源</h3>
    <span class="muted small">真实相机 / 合成场景 / 离线回放，三种来源共用同一套流水线</span></header>
  <div id="capture-source"></div>
</div>

<div class="card" id="capture-config"></div>

<div class="panels">
  <div class="panel-img"><span class="panel-title">实时彩色画面</span><img id="cap-rgb" alt="彩色画面"></div>
  <div class="panel-img"><span class="panel-title">深度伪彩</span><img id="cap-depth" alt="深度画面"></div>
</div>

<div class="grid c2">
  <div class="card">
    <header><h3>当前会话</h3></header>
    <div id="capture-info"></div>
    <h4 style="margin-top:12px">标准距离点完成情况</h4>
    <div id="capture-plan"></div>
  </div>
  <div class="card">
    <header><h3>历史采集会话</h3></header>
    <div id="capture-sessions"></div>
  </div>
</div>

<div class="card">
  <header><h3>本次采集记录</h3>
    <span class="muted small">RGB 与 16 位深度已落盘，可录入真值</span></header>
  <div id="capture-items"></div>
</div>
{% endblock %}
